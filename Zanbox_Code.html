<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GMod Loading Screen</title>
  
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1530240462374441131/1530879541948584049/0726.gif?ex=6a672e2d&is=6a65dcad&hm=2345c09275a53322beb7f59371e65dfa612fe3cb4f0bd3420c8f5200521dbaeb&">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Контейнер для фоновых изображений */
    .bg-slider {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%; 
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 1.8s ease-in-out;
      opacity: 0;
      z-index: 1;
    }

    .bg-slider.active {
      opacity: 1;
    }

    /* ЭФФЕКТЫ */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 85%, rgba(0,0,0,0.98) 100%);
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
    }

    .film-grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.04;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
    }

    /* --- ЦЕНТРАЛЬНАЯ ГИФКА СВЕРХУ --- */
    .top-center-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .top-center-gif {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border: 1px solid rgba(80, 120, 80, 0.5);
      background: rgba(10, 14, 10, 0.85);
      padding: 4px;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .top-center-title {
      font-size: 11px;
      letter-spacing: 3px;
      color: #8fae8f;
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(0,0,0,0.9);
    }

    /* --- МИЛИТАРИ МУЗЫКАЛЬНЫЙ ПЛЕЕР (СЛЕВА ВВЕРХУ) --- */
    .music-player {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(12, 16, 12, 0.85);
      padding: 12px;
      border-radius: 2px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(80, 120, 80, 0.4);
      border-left: 3px solid #5a7a5a;
      color: #7a9a7a;
      user-select: none;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      width: 310px;
    }

    .track-details {
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .track-details.fade-out {
      opacity: 0;
    }

    .track-cover {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border: 1px solid rgba(80, 120, 80, 0.5);
      background: #000;
      flex-shrink: 0;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .track-title {
      font-size: 11px;
      font-weight: bold;
      color: #c0d4c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 9px;
      color: #6a8a6a;
      text-transform: uppercase;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ШКАЛА ПРОГРЕССА И ПЕРЕМОТКА */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(40, 60, 40, 0.8);
      border-radius: 0;
      outline: none;
      cursor: pointer;
      border: 1px solid rgba(80, 120, 80, 0.3);
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 12px;
      background: #5a7a5a;
      cursor: pointer;
      border: 1px solid #8fae8f;
      transition: background 0.2s, transform 0.1s ease;
    }

    .progress-slider::-webkit-slider-thumb:hover {
      background: #8fae8f;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: #5a7a5a;
      letter-spacing: 0.5px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid rgba(80, 120, 80, 0.2);
      padding-top: 8px;
    }

    .control-btn {
      background: rgba(20, 30, 20, 0.6);
      border: 1px solid rgba(80, 120, 80, 0.4);
      color: #8fae8f;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(40, 60, 40, 0.8);
      color: #ffffff;
      border-color: #8fae8f;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(40, 60, 40, 0.8);
      border-radius: 0;
      outline: none;
      cursor: pointer;
      border: 1px solid rgba(80, 120, 80, 0.3);
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 12px;
      background: #5a7a5a;
      cursor: pointer;
      border: 1px solid #8fae8f;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: #8fae8f;
    }

    /* --- ВОЕННЫЙ БЛОК С ЦИТАТАМИ ВНИЗУ --- */
    .quote-box {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 80%;
      max-width: 900px;
      background: rgba(10, 14, 10, 0.85);
      border-left: 3px solid #5a7a5a;
      border-right: 1px solid rgba(80, 120, 80, 0.3);
      border-top: 1px solid rgba(80, 120, 80, 0.3);
      border-bottom: 1px solid rgba(80, 120, 80, 0.3);
      padding: 12px 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      user-select: none;
    }

    .quote-header {
      font-size: 10px;
      letter-spacing: 2px;
      color: #5a7a5a;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .quote-text {
      font-size: 13px;
      color: #b0c4b0;
      line-height: 1.4;
      transition: opacity 0.8s ease;
      opacity: 1;
    }

    .quote-text.fade {
      opacity: 0;
    }

    /* --- ВЕРТИКАЛЬНАЯ ПАНЕЛЬ КОМАНДОВАНИЯ СПРАВА --- */
    .staff-box {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 10;
      width: 230px;
      background: rgba(10, 14, 10, 0.85);
      border-right: 3px solid #5a7a5a;
      border-left: 1px solid rgba(80, 120, 80, 0.3);
      border-top: 1px solid rgba(80, 120, 80, 0.3);
      border-bottom: 1px solid rgba(80, 120, 80, 0.3);
      padding: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      user-select: none;
    }

    .staff-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #5a7a5a;
      text-transform: uppercase;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(80, 120, 80, 0.3);
      padding-bottom: 6px;
    }

    .header-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .staff-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .staff-item {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      padding: 6px;
      background: rgba(20, 30, 20, 0.4);
      border: 1px solid rgba(80, 120, 80, 0.2);
      transition: all 0.2s ease;
    }

    .staff-item:hover {
      background: rgba(40, 60, 40, 0.6);
      border-color: #8fae8f;
      transform: translateX(-3px);
    }

    .avatar-wrapper {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .staff-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 1px solid rgba(143, 174, 143, 0.5);
    }

    .status-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 8px;
      height: 8px;
      background-color: #5a7a5a;
      border: 1px solid #0a0e0a;
    }

    .staff-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .staff-name {
      font-size: 11px;
      font-weight: bold;
      color: #c0d4c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .staff-role {
      font-size: 9px;
      color: #6a8a6a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Слои для фоновых картинок -->
  <div id="bg1" class="bg-slider"></div>
  <div id="bg2" class="bg-slider"></div>

  <!-- Атмосферные постобработки -->
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="film-grain"></div>

  <!-- Большая гифка по центру сверху -->
  <div class="top-center-banner">
    <img src="https://cdn.discordapp.com/attachments/1530240462374441131/1530879541948584049/0726.gif?ex=6a672e2d&is=6a65dcad&hm=2345c09275a53322beb7f59371e65dfa612fe3cb4f0bd3420c8f5200521dbaeb&" class="top-center-gif" alt="ZANBOX Logo">
    <span class="top-center-title">ZANBOX PROJECT</span>
  </div>

  <!-- Милитари музыкальный плеер -->
  <div class="music-player">
    <div id="track-details" class="track-details">
      <img id="track-cover" class="track-cover" src="" alt="Cover">
      <div class="track-info">
        <span id="track-title" class="track-title">Загрузка...</span>
        <span id="track-artist" class="track-artist">...</span>
      </div>
    </div>
    
    <!-- Полоса прогресса и перемотки -->
    <div class="progress-container">
      <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0" step="0.01">
      <div class="time-info">
        <span id="current-time">00:00</span>
        <span id="duration-time">00:00</span>
      </div>
    </div>

    <div class="player-controls">
      <div style="display: flex; gap: 4px;">
        <button id="btn-prev" class="control-btn">|&lt;</button>
        <button id="btn-play" class="control-btn">||</button>
        <button id="btn-next" class="control-btn">&gt;|</button>
      </div>

      <div class="volume-row">
        <span style="font-size: 9px; color: #5a7a5a;">VOL</span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
      </div>
    </div>
  </div>

  <!-- Вертикальная панель состава справа -->
  <div class="staff-box">
    <div class="staff-header">
      <img src="https://cdn.discordapp.com/attachments/1530240462374441131/1530879541948584049/0726.gif?ex=6a672e2d&is=6a65dcad&hm=2345c09275a53322beb7f59371e65dfa612fe3cb4f0bd3420c8f5200521dbaeb&" class="header-icon" alt="ZANBOX">
      <span>// СОСТАВ ZANBOX</span>
    </div>
    <div id="staff-list" class="staff-list"></div>
  </div>

  <!-- Панель военной цитаты снизу -->
  <div class="quote-box">
    <div class="quote-header">// ПРИКАЗ_И_ВЫПИСКА_ИЗ_УСТАВА</div>
    <div id="quote-text" class="quote-text">Загрузка данных...</div>
  </div>

  <!-- Элемент аудио -->
  <audio id="bg-music" preload="auto" autoplay></audio>

  <script>
    // ============================================================
    // 0. СПИСОК АДМИНИСТРАЦИИ
    // ============================================================
    const staffMembers = [
      {
        discordId: "1522879601108451448",
        customName: "", 
        fallbackName: "Walter Hisenberg",
        role: "Создатель",
        steamUrl: "https://steamcommunity.com/profiles/76561199672616417"
      },
      {
        discordId: "933638357941096478",
        customName: "Пилюля",
        fallbackName: "Пилюля",
        role: "Разработчик-Инвентолог",
        steamUrl: "https://steamcommunity.com/profiles/76561198974516568/"
      },
      {
        discordId: "736178047274713151",
        customName: "",
        fallbackName: "svqps1337",
        role: "Разработчик-Медийка",
        steamUrl: "https://steamcommunity.com/id/arteemmmqa"
      },
      {
        discordId: "1047178362549960784",
        customName: "",
        fallbackName: "Milin | Мотя",
        role: "Разработчик-Инвентолог",
        steamUrl: "https://steamcommunity.com/profiles/76561199638493985"
      },
      {
        discordId: "1353034856552071178",
        customName: "", 
        fallbackName: "Alabuga Militech",
        role: "Разработчик",
        steamUrl: "https://steamcommunity.com/profiles/76561199241914892/"
      }
    ];

    async function fetchDiscordUserData(discordId) {
      if (!discordId) return null;
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
        const data = await response.json();
        if (data.success && data.data) {
          const user = data.data.discord_user;
          const avatarUrl = user.avatar 
            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
            : `https://cdn.discordapp.com/embed/avatars/${parseInt(user.discriminator || 0) % 5}.png`;
          
          const displayName = user.global_name || user.username;
          return { name: displayName, avatar: avatarUrl };
        }
      } catch (e) {
        console.warn(`Не удалось загрузить данные Discord ID: ${discordId}`, e);
      }
      return null;
    }

    async function renderStaff() {
      const container = document.getElementById('staff-list');
      container.innerHTML = '';

      for (const member of staffMembers) {
        const item = document.createElement('a');
        item.className = 'staff-item';
        item.href = member.steamUrl;
        item.target = '_blank';

        let finalName = member.customName || member.fallbackName;
        let finalAvatar = "https://cdn.discordapp.com/embed/avatars/0.png";

        const liveData = await fetchDiscordUserData(member.discordId);
        if (liveData) {
          if (!member.customName) {
            finalName = liveData.name;
          }
          finalAvatar = liveData.avatar;
        }

        item.innerHTML = `
          <div class="avatar-wrapper">
            <img class="staff-avatar" src="${finalAvatar}" alt="${finalName}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="status-dot"></div>
          </div>
          <div class="staff-info">
            <span class="staff-name">${finalName}</span>
            <span class="staff-role">${member.role}</span>
          </div>
        `;
        container.appendChild(item);
      }
    }

    renderStaff();

    // ============================================================
    // 1. СПИСОК ЦИТАТ
    // ============================================================
    const quotes = [
      "«Война — это не кто правее, а кто останется в живых.»",
      "«Самое страшное на войне — это не смерть, а осознание того, что ты привык к ней.»",
      "«Мир — это лишь пауза между войнами.»",
      "«Настоящий солдат воюет не потому, что ненавидит то, что перед ним, а потому, что любит то, что за ним.»",
      "«Солдат спит — служба идет. Солдат проснулся — служба продолжается.»",
      "«Тишина на фронте всегда предвещает бурю.»",
      "«Память о павших — единственное оружие против забвения.»"
    ];

    const QUOTE_CHANGE_INTERVAL = 7000;
    const quoteElement = document.getElementById('quote-text');
    let playedQuotes = [];

    function getRandomQuoteIndex() {
      if (quotes.length === 0) return -1;
      if (quotes.length === 1) return 0;

      if (playedQuotes.length >= quotes.length) {
        playedQuotes = [];
      }

      let index;
      do {
        index = Math.floor(Math.random() * quotes.length);
      } while (playedQuotes.includes(index));

      return index;
    }

    function changeQuote() {
      if (quotes.length === 0) return;

      const nextIndex = getRandomQuoteIndex();
      if (nextIndex === -1) return;

      playedQuotes.push(nextIndex);
      quoteElement.classList.add('fade');

      setTimeout(() => {
        quoteElement.textContent = quotes[nextIndex];
        quoteElement.classList.remove('fade');
      }, 800);
    }

    changeQuote();
    setInterval(changeQuote, QUOTE_CHANGE_INTERVAL);

    // ============================================================
    // 2. СПИСОК ТРЕКОВ С ИНФОРМАЦИЕЙ
    // ============================================================
    const musicTracks = [
      {
        title: "Люди надоели",
        artist: "Молчат Дома",
        cover: "https://avatars.mds.yandex.net/get-entity_search/2431491/1231058082/SUx104_2x",
        src: "https://ru.hitmoz.org/get/music/20190620/molchat_doma_-_Lyudi_nadoeli_65122819.mp3"
      },
      {
        title: "Клетка",
        artist: "Молчат Дома",
        cover: "https://avatars.mds.yandex.net/get-entity_search/2334190/1230783219/SUx104_2x",
        src: "https://ru.hitmoz.org/get/music/20180911/Molchat_Doma_-_Kletka_58595718.mp3"
      },
      {
        title: "Спектакль окончен",
        artist: "Черниковская Хата",
        cover: "https://avatars.mds.yandex.net/get-entity_search/50039/116912709/SUx104_2x",
        src: "https://ru.hitmoz.org/get/music/20200530/Chernikovskaya_Hata_-_Spektakl_Okonchen_69749630.mp3"
      },
      {
        title: "Поражение",
        artist: "Буерак",
        cover: "https://avatars.mds.yandex.net/get-entity_search/2238866/1257327581/SUx104_2x",
        src: "https://ru.hitmoz.org/get/music/20220909/Buerak_-_Porazhenie_74701706.mp3"
      },
      {
        title: "Культ тела",
        artist: "Буерак",
        cover: "https://avatars.mds.yandex.net/get-entity_search/1545396/402780583/SUx104_2x",
        src: "https://ru.hitmoz.org/get/music/20190605/Buerak_-_Kult_tela_64798632.mp3"
      },
      {
        title: "Ты и твоя тень",
        artist: "Увула",
        cover: "https://t2.genius.com/unsafe/344x344/https%3A%2F%2Fimages.genius.com%2F2b29e471e99d11d289f2558da97781e0.1000x1000x1.png",
        src: "https://ru.hitmoz.org/get/music/20190117/Uvula_-_Ty_i_tvoya_ten_61468277.mp3"
      }
    ];

    // ============================================================
    // 3. ПЛЕЕР, КНОПКИ И ПЛАВНЫЙ ПЕРЕХОД
    // ============================================================
    const audio = document.getElementById('bg-music');
    const volumeSlider = document.getElementById('volume-slider');
    const trackDetails = document.getElementById('track-details');
    const trackCover = document.getElementById('track-cover');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const progressSlider = document.getElementById('progress-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    let currentTrackIndex = 0;
    let isUserSeeking = false;
    let targetVolume = 0.3; 
    let fadeInterval = null; 
    let isTransitioning = false; 
    let isResettingSlider = false;

    let currentDisplayedDuration = 0;

    const savedVolume = localStorage.getItem('gmod_music_volume');
    if (savedVolume !== null) {
      targetVolume = parseFloat(savedVolume);
    }
    volumeSlider.value = targetVolume;

    volumeSlider.addEventListener('input', (e) => {
      targetVolume = parseFloat(e.target.value);
      localStorage.setItem('gmod_music_volume', targetVolume);
      if (!isTransitioning) {
        audio.volume = targetVolume;
      }
    });

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateProgressLoop() {
      if (!isUserSeeking && !isResettingSlider && audio.duration && !audio.paused) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressSlider.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        
        currentDisplayedDuration = audio.duration;
        durationTimeEl.textContent = formatTime(audio.duration);

        const timeLeft = audio.duration - audio.currentTime;
        if (timeLeft <= 1.5 && !isTransitioning) {
          fadeOutAudio(() => {}, 1400);
        }
      }
      requestAnimationFrame(updateProgressLoop);
    }
    requestAnimationFrame(updateProgressLoop);

    function animateSliderReset(duration = 600, callback) {
      isResettingSlider = true;
      const startVal = parseFloat(progressSlider.value);
      const startTime = performance.now();
      const startAudioTime = audio.currentTime || 0;
      const startDurationVal = currentDisplayedDuration || 0;

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const currentVal = startVal * (1 - progress);
        const currentSec = startAudioTime * (1 - progress);
        const currentDur = startDurationVal * (1 - progress);

        progressSlider.value = currentVal;
        currentTimeEl.textContent = formatTime(currentSec);
        durationTimeEl.textContent = formatTime(currentDur);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          progressSlider.value = 0;
          currentTimeEl.textContent = "00:00";
          durationTimeEl.textContent = "00:00";
          currentDisplayedDuration = 0;
          isResettingSlider = false;
          if (callback) callback();
        }
      }
      requestAnimationFrame(step);
    }

    function animateDurationTo(targetDuration, duration = 800) {
      isResettingSlider = true;
      const startTime = performance.now();
      const startDur = currentDisplayedDuration || 0;

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const currentDur = startDur + (targetDuration - startDur) * progress;
        durationTimeEl.textContent = formatTime(currentDur);
        currentDisplayedDuration = currentDur;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          durationTimeEl.textContent = formatTime(targetDuration);
          currentDisplayedDuration = targetDuration;
          isResettingSlider = false;
        }
      }
      requestAnimationFrame(step);
    }

    function fadeOutAudio(callback, duration = 800) {
      clearInterval(fadeInterval);
      isTransitioning = true;
      const stepTime = 50;
      const steps = duration / stepTime;
      const volumeStep = audio.volume / steps;

      fadeInterval = setInterval(() => {
        if (audio.volume - volumeStep > 0) {
          audio.volume -= volumeStep;
        } else {
          audio.volume = 0;
          clearInterval(fadeInterval);
          if (callback) callback();
        }
      }, stepTime);
    }

    function fadeInAudio(duration = 1000) {
      clearInterval(fadeInterval);
      audio.volume = 0;
      const stepTime = 50;
      const steps = duration / stepTime;
      const volumeStep = targetVolume / steps;

      fadeInterval = setInterval(() => {
        if (audio.volume + volumeStep < targetVolume) {
          audio.volume += volumeStep;
        } else {
          audio.volume = targetVolume;
          clearInterval(fadeInterval);
          isTransitioning = false;
        }
      }, stepTime);
    }

    function loadTrack(index) {
      if (index < 0) index = musicTracks.length - 1;
      if (index >= musicTracks.length) index = 0;

      const performSwitch = () => {
        currentTrackIndex = index;
        const track = musicTracks[currentTrackIndex];

        trackDetails.classList.add('fade-out');

        animateSliderReset(500, () => {
          setTimeout(() => {
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            trackCover.src = track.cover;

            trackDetails.classList.remove('fade-out');

            audio.load();
            playAudio();
            fadeInAudio(1000);
          }, 200);
        });
      };

      if (!audio.paused && audio.currentTime > 0) {
        fadeOutAudio(performSwitch, 600);
      } else {
        performSwitch();
      }
    }

    function playAudio() {
      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          btnPlay.textContent = "||";
        }).catch(error => {
          btnPlay.textContent = ">";
          console.warn("Ожидание действия пользователя для запуска музыки:", error);
        });
      }
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        btnPlay.textContent = "||";
        fadeInAudio(500);
      } else {
        fadeOutAudio(() => {
          audio.pause();
          btnPlay.textContent = ">";
        }, 400);
      }
    }

    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => loadTrack(currentTrackIndex + 1));
    btnPrev.addEventListener('click', () => loadTrack(currentTrackIndex - 1));

    audio.addEventListener('loadedmetadata', () => {
      animateDurationTo(audio.duration, 800);
    });

    progressSlider.addEventListener('mousedown', () => { isUserSeeking = true; });
    progressSlider.addEventListener('touchstart', () => { isUserSeeking = true; });

    progressSlider.addEventListener('input', (e) => {
      if (audio.duration) {
        const seekTime = (e.target.value / 100) * audio.duration;
        currentTimeEl.textContent = formatTime(seekTime);
      }
    });

    progressSlider.addEventListener('change', (e) => {
      if (audio.duration) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
      isUserSeeking = false;
    });

    audio.addEventListener('ended', () => {
      loadTrack(currentTrackIndex + 1);
    });

    audio.addEventListener('error', (e) => {
      console.error("Не удалось проиграть файл:", audio.src, e);
      if (musicTracks.length > 1) {
        setTimeout(() => loadTrack(currentTrackIndex + 1), 1000);
      }
    });

    currentTrackIndex = Math.floor(Math.random() * musicTracks.length);
    loadTrack(currentTrackIndex);

    function forcePlayOnInteraction() {
      if (audio.paused) {
        playAudio();
      }
    }

    ['click', 'keydown', 'mousemove', 'scroll'].forEach(evt => {
      document.addEventListener(evt, forcePlayOnInteraction);
    });

    window.addEventListener('DOMContentLoaded', playAudio);
    window.addEventListener('load', playAudio);

    function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
      playAudio();
    }

    const DISPLAY_TIME = 5000;

    const layer1 = document.getElementById('bg1');
    const layer2 = document.getElementById('bg2');

    let activeLayer = layer1;
    let inactiveLayer = layer2;
    
    let playedImages = [];

    function getRandomImgIndex() {
      if (images.length === 0) return -1;
      if (images.length === 1) return 0;

      if (playedImages.length >= images.length) {
        playedImages = [];
      }

      let index;
      do {
        index = Math.floor(Math.random() * images.length);
      } while (playedQuotes.includes(index));

      return index;
    }

    function showNextImage() {
      if (images.length === 0) return;

      const nextIndex = getRandomImgIndex();
      if (nextIndex === -1) return;

      playedImages.push(nextIndex);
      const imageUrl = images[nextIndex];

      const imgPreloader = new Image();
      imgPreloader.src = imageUrl;
      imgPreloader.onload = () => {
        inactiveLayer.style.backgroundImage = `url('${imageUrl}')`;
        inactiveLayer.classList.add('active');
        activeLayer.classList.remove('active');

        const temp = activeLayer;
        activeLayer = inactiveLayer;
        inactiveLayer = temp;
      };
    }

    showNextImage();
    setInterval(showNextImage, DISPLAY_TIME);
